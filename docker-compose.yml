services:
  chart-renderer:
    build:
      context: .
    container_name: chart-renderer
    env_file:
      - .env
    ports:
      - "${CHART_RENDERER_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10
